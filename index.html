const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(password){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(box.s),iterations:box.r,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(box.i)},key,bytes(box.d)));
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();document.getElementById('err').textContent='';
  try{const html=await open(document.getElementById('p').value);document.open();document.write(html);document.close();}
  catch{document.getElementById('err').textContent='That is not the password.';}
});
